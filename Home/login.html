<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | VIVEKANAND COLLEGE PLACEMENT CELL</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(7, 25, 48, 0.94),
                    rgba(13, 55, 95, 0.94)
                ),
                url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 16px 15px;
        }


        /* ================= MAIN CARD ================= */

        .login-card {

            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }


        /* ================= HEADER ================= */

        .header {

            background: #0b1f3a;

            padding: 16px 22px;

            text-align: center;

            color: white;
        }

        .header h1 {

            color: #ffb703;

            font-size: 20px;

            margin-bottom: 4px;

            letter-spacing: 1px;
        }

        .header h1 span {
            color: #ffb703;
        }

        /* ================= CONTAINER ================= */

        .form-container {

            padding: 22px 30px;
        }


        .form-title {

            text-align: center;

            margin-bottom: 20px;
        }

        .form-title h2 {

            color: #0b1f3a;

            font-size: 22px;

            margin-bottom: 4px;
        }

        .form-title p {

            color: #777;

            font-size: 12px;
        }


        /* ================= MESSAGE ================= */

        .message {

            display: none;

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;
        }

        .error {

            background: #ffe8e8;

            color: #c62828;

            border: 1px solid #f5b5b5;
        }

        .success {

            background: #e8f7ed;

            color: #16723b;

            border: 1px solid #a9dfbc;
        }


        /* ================= ROLE SELECTION ================= */

        .role-title {

            display: block;

            font-size: 14px;

            font-weight: bold;

            color: #26374d;

            margin-bottom: 10px;
        }


        .role-options {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 12px;
        }


        .role-option {

            position: relative;
        }


        .role-option input {

            position: absolute;

            opacity: 0;

            pointer-events: none;
        }


        .role-label {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 58px;

            padding: 6px 5px;

            border: 1px solid #d5dce5;

            border-radius: 10px;

            background: #f9fafc;

            color: #26374d;

            cursor: pointer;

            transition: 0.3s;

            text-align: center;
        }


        .role-label .role-icon {

            font-size: 20px;

            margin-bottom: 2px;
        }


        .role-label span:last-child {

            font-size: 11px;

            font-weight: bold;
        }


        .role-option input:checked + .role-label {

            border-color: #1455a0;

            background: #eaf2ff;

            color: #0b1f3a;

            box-shadow:
                0 0 0 2px rgba(20, 85, 160, 0.10);
        }


        .role-label:hover {

            border-color: #1455a0;

            transform: translateY(-2px);
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 11px;
        }

        label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            color: #26374d;

            margin-bottom: 5px;
        }

        label span {

            color: red;
        }


        input,
        select {

            width: 100%;

            padding: 9px 12px;

            border: 1px solid #d5dce5;

            border-radius: 8px;

            background: #f9fafc;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus {

            border-color: #1455a0;

            background: white;

            box-shadow:
                0 0 0 3px rgba(20, 85, 160, 0.10);
        }


        /* ================= PASSWORD ================= */

        .password-box {

            position: relative;
        }

        .password-box input {

            padding-right: 70px;
        }

        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #1455a0;

            font-weight: bold;

            cursor: pointer;
        }


        /* ================= LOGIN BUTTON ================= */

        .submit-btn {

            width: 72%;

            display: block;

            margin: 5px auto 0;

            padding: 8px 20px;

            border: none;

            border-radius: 30px;

            background: #ffb703;

            color: #111;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }

        .submit-btn:hover {

            background: #0b1f3a;

            color: white;

            transform: translateY(-2px);
        }


        /* ================= FORGOT PASSWORD ================= */

        .forgot-container {

            text-align: right;

            margin-top: 3px;

            margin-bottom: 20px;
        }

        .forgot-btn {

            border: none;

            background: none;

            color: #1455a0;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;
        }

        .forgot-btn:hover {

            text-decoration: underline;
        }


        /* ================= BACK ================= */

        .back-home {

            text-align: center;

            margin-top: 25px;
        }

        .back-home a {

            color: #1455a0;

            font-weight: bold;

            text-decoration: none;
        }

        .back-home a:hover {

            text-decoration: underline;
        }


        /* ================= REGISTER ================= */

        .register-text {

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 14px;
        }

        .register-text a {

            color: #1455a0;

            font-weight: bold;

            text-decoration: none;
        }


        /* ================= FORGOT PASSWORD SCREEN ================= */

        #forgotSection {

            display: none;
        }


        .step {

            display: none;
        }

        .step.active {

            display: block;
        }

        .forgot-mode > *:not(.step) {
            display: none;
        }


        .back-login {

            text-align: center;

            margin-top: 20px;
        }

        .back-login button {

            border: none;

            background: transparent;

            color: #1455a0;

            font-weight: bold;

            cursor: pointer;
        }


        /* ================= LOADING ================= */

        .loading {

            opacity: 0.7;

            pointer-events: none;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }

            .header h1 {

                font-size: 20px;
            }

            .header {
                padding: 14px 12px;
            }

            .form-container {

                padding: 18px 16px;
            }


            .role-options {

                grid-template-columns: 1fr;
            }


            .role-label {

                min-height: 54px;

                flex-direction: row;

                gap: 8px;
            }


            .role-label .role-icon {

                margin-bottom: 0;
            }
        }

    </style>

</head>


<body>


<div class="login-card">

    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>
            VIVEKANAND PLACEMENT CELL
        </h1>

    </div>


    <!-- ================================================= -->
    <!-- LOGIN SECTION -->
    <!-- ================================================= -->

    <div
        class="form-container"
        id="loginSection">

        <div class="form-title">

            <h2>
                Login
            </h2>

            <p>
                Login to access your placement account.
            </p>

        </div>

        <div class="form-group">

            <label class="role-title">
                Login As <span>*</span>
            </label>

            <div class="role-options">

                <div class="role-option">
                    <input
                        type="radio"
                        id="studentRole"
                        name="loginRole"
                        value="student"
                        checked>
                    <label for="studentRole" class="role-label">
                        <span class="role-icon">👨‍🎓</span>
                        <span>Student</span>
                    </label>
                </div>

                <div class="role-option">
                    <input
                        type="radio"
                        id="adminRole"
                        name="loginRole"
                        value="admin">
                    <label for="adminRole" class="role-label">
                        <span class="role-icon">👨‍💼</span>
                        <span>Admin</span>
                    </label>
                </div>

                <div class="role-option">
                    <input
                        type="radio"
                        id="companyRole"
                        name="loginRole"
                        value="company">
                    <label for="companyRole" class="role-label">
                        <span class="role-icon">🏢</span>
                        <span>Company</span>
                    </label>
                </div>

            </div>

        </div>


        <!-- LOGIN MESSAGE -->

        <div
            id="loginMessage"
            class="message">
        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            onsubmit="handleLogin(event)">


            <!-- USERNAME -->

            <div class="form-group">

                <label>
                    Username or Email <span>*</span>
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter username or email"
                    autocomplete="username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password <span>*</span>
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('loginPassword', this)">

                        Show

                    </button>
                </div>

                <div class="forgot-container">
                    <button
                        type="button"
                        class="forgot-btn"
                        onclick="showForgotPassword()">
                        Forgot Password?
                    </button>
                </div>

            </div>

            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="submit-btn"
                id="loginButton">

                Login

            </button>


        </form>

        <p class="register-text">
            Don't have an account?
            <a href="registration.html">Register Here</a>
        </p>

        <div class="back-home">
            <a href="index.html">&larr; Back to Home</a>
        </div>


        <!-- REGISTER -->

        <!-- ================================================= -->

        <div
            class="step"
            id="stepEmail">


            <div class="form-title">

                <h2>
                    Forgot Password?
                </h2>

                <p>
                    Enter your registered student email.
                </p>

            </div>


            <div
                id="forgotMessage"
                class="message">
            </div>


            <form
                onsubmit="sendOTP(event)">


                <div class="form-group">

                    <label>
                        Registered Email <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                    id="sendOtpButton">

                    Send OTP

                </button>


            </form>


            <div class="back-login">

                <button
                    type="button"
                    onclick="showLogin()">

                    ← Back to Login

                </button>

            </div>


        </div>



        <!-- ================================================= -->
        <!-- STEP 2 : OTP -->
        <!-- ================================================= -->

        <div
            class="step"
            id="stepOTP">


            <div class="form-title">

                <h2>
                    Verify OTP
                </h2>

                <p>
                    Enter the OTP sent to your registered email.
                </p>

            </div>


            <div
                id="otpMessage"
                class="message">
            </div>


            <form
                onsubmit="verifyOTP(event)">


                <div class="form-group">

                    <label>
                        Enter OTP <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        inputmode="numeric"
                        required>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Verify OTP

                </button>


            </form>


            <div class="back-login">

                <button
                    type="button"
                    onclick="showEmailStep()">

                    ← Change Email

                </button>

            </div>


        </div>



        <!-- ================================================= -->
        <!-- STEP 3 : NEW PASSWORD -->
        <!-- ================================================= -->

        <div
            class="step"
            id="stepPassword">


            <div class="form-title">

                <h2>
                    Create New Password
                </h2>

                <p>
                    Enter your new password below.
                </p>

            </div>


            <div
                id="resetMessage"
                class="message">
            </div>


            <form
                onsubmit="resetPassword(event)">


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label>
                        New Password <span>*</span>
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('newPassword', this)">

                            Show

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label>
                        Confirm Password <span>*</span>
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Confirm new password"
                            minlength="6"
                            required>

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmNewPassword', this)">

                            Show

                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Update Password

                </button>


            </form>


        </div>


    </div>


</div>



<script>


/* ========================================================= */
/* API URL */
/* ========================================================= */

const API_URL = "http://localhost:5000/api";



/* ========================================================= */
/* SHOW / HIDE PASSWORD */
/* ========================================================= */

function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {

        input.type = "text";

        button.innerText = "Hide";

    } else {

        input.type = "password";

        button.innerText = "Show";

    }

}



/* ========================================================= */
/* SHOW LOGIN */
/* ========================================================= */

function showLogin() {

    const loginSection = document.getElementById("loginSection");

    loginSection.style.display = "block";
    loginSection.classList.remove("forgot-mode");

    document.querySelectorAll(".step").forEach(function(step) {
        step.classList.remove("active");
    });

}



/* ========================================================= */
/* SHOW FORGOT PASSWORD */
/* ========================================================= */

function showForgotPassword() {

    const loginSection = document.getElementById("loginSection");

    loginSection.style.display = "block";
    loginSection.classList.add("forgot-mode");

    showEmailStep();

}



/* ========================================================= */
/* SHOW EMAIL STEP */
/* ========================================================= */

function showEmailStep() {

    document.querySelectorAll(".step").forEach(function(step) {

        step.classList.remove("active");

    });

    document
        .getElementById("stepEmail")
        .classList.add("active");

}



/* ========================================================= */
/* SHOW OTP STEP */
/* ========================================================= */

function showOTPStep() {

    document.querySelectorAll(".step").forEach(function(step) {

        step.classList.remove("active");

    });

    document
        .getElementById("stepOTP")
        .classList.add("active");

}



/* ========================================================= */
/* SHOW PASSWORD STEP */
/* ========================================================= */

function showPasswordStep() {

    document.querySelectorAll(".step").forEach(function(step) {

        step.classList.remove("active");

    });

    document
        .getElementById("stepPassword")
        .classList.add("active");

}



/* ========================================================= */
/* HANDLE LOGIN */
/* ========================================================= */

async function handleLogin(event) {

    event.preventDefault();


    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const selectedRole =
        document.querySelector(
            'input[name="loginRole"]:checked'
        );


    const message =
        document.getElementById("loginMessage");


    const loginButton =
        document.getElementById("loginButton");


    message.style.display = "none";


    /* ================================================= */
    /* CHECK ROLE */
    /* ================================================= */

    if (!selectedRole) {

        message.className =
            "message error";

        message.innerText =
            "Please select a login type.";

        message.style.display =
            "block";

        return;

    }


    const role =
        selectedRole.value;


    console.log("LOGIN ROLE:", role);


    /* ================================================= */
    /* VALIDATION */
    /* ================================================= */

    if (!username || !password) {

        message.className =
            "message error";

        message.innerText =
            "Please enter username and password.";

        message.style.display =
            "block";

        return;

    }


    try {

        loginButton.disabled = true;

        loginButton.innerText =
            "Logging in...";


        /* ================================================= */
        /* ENDPOINT + REQUEST BODY */
        /* ================================================= */

        let endpoint;

        let requestBody;


        /* ================= COMPANY ================= */

        if (role === "company") {

            endpoint =
                API_URL + "/auth/company-login";


            requestBody = {

                username: username,

                password: password

            };

        }


        /* ================= STUDENT ================= */

        else if (role === "student") {

            endpoint =
                API_URL + "/auth/student-login";


            requestBody = {

                username: username,

                password: password

            };

        }


        /* ================= ADMIN ================= */

        else if (role === "admin") {

            endpoint =
                API_URL + "/auth/admin-login";


            requestBody = {

                username: username,

                password: password

            };

        }


        console.log("LOGIN ENDPOINT:", endpoint);

        console.log("LOGIN REQUEST:", requestBody);


        /* ================================================= */
        /* API REQUEST */
        /* ================================================= */

        const response =
            await fetch(
                endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )
                }
            );


        /* ================================================= */
        /* READ RESPONSE SAFELY */
        /* ================================================= */

        let data = {};

        try {

            data = await response.json();

        } catch (jsonError) {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        console.log("LOGIN RESPONSE:", data);


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Invalid username or password."
            );

        }


        /* ================================================= */
        /* SUCCESS MESSAGE */
        /* ================================================= */

        message.className =
            "message success";

        message.innerText =
            data.message ||
            "Login successful!";

        message.style.display =
            "block";


        /* ================================================= */
        /* SAVE USER INFORMATION */
        /* ================================================= */

        if (data.user) {

            /* ================= COMMON ================= */

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

            localStorage.setItem(
                "userRole",
                role
            );


            /* ================= STUDENT ================= */

            if (role === "student") {

                localStorage.setItem(
                    "studentUser",
                    JSON.stringify(data.user)
                );


                localStorage.setItem(
                    "studentId",
                    data.user.id
                );

            }


            /* ================= ADMIN ================= */

            if (role === "admin") {

                localStorage.setItem(
                    "adminUser",
                    JSON.stringify(data.user)
                );

            }


            /* ================= COMPANY ================= */

            if (role === "company") {

                localStorage.setItem(
                    "companyUser",
                    JSON.stringify(data.user)
                );

            }

        }


        /* ================================================= */
        /* REDIRECT BASED ON ROLE */
        /* ================================================= */

        setTimeout(function() {


            if (role === "student") {

                window.location.href =
                    "./student-dashboard.html";

            }


            else if (role === "admin") {

                window.location.href =
                    "./admin-dashboard.html";

            }


            else if (role === "company") {

                window.location.href =
                    "./company-dashboard.html";

            }


        }, 700);


    }


    catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        message.className =
            "message error";

        message.innerText =
            error.message ||
            "Login failed.";

        message.style.display =
            "block";

    }


    finally {

        loginButton.disabled = false;

        loginButton.innerText =
            "Login";

    }

}



/* ========================================================= */
/* STEP 1 - SEND OTP */
/* ========================================================= */

async function sendOTP(event) {

    event.preventDefault();


    const email =
        document
            .getElementById("forgotEmail")
            .value
            .trim();


    const message =
        document.getElementById("forgotMessage");


    const button =
        document.getElementById("sendOtpButton");


    message.style.display = "none";


    if (!email) {

        message.className =
            "message error";

        message.innerText =
            "Please enter your registered email.";

        message.style.display =
            "block";

        return;

    }


    try {

        button.disabled = true;

        button.innerText =
            "Sending OTP...";


        const response =
            await fetch(
                API_URL + "/auth/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        role: document.querySelector(
                            'input[name="loginRole"]:checked'
                        )?.value || "student"

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Email not found."
            );

        }


        /* ================================================= */
        /* SAVE EMAIL */
        /* ================================================= */

        sessionStorage.setItem(
            "resetEmail",
            email
        );

        sessionStorage.setItem(
            "resetRole",
            document.querySelector(
                'input[name="loginRole"]:checked'
            )?.value || "student"
        );


        message.className =
            "message success";

        message.innerText =
            data.message ||
            "OTP has been sent to your registered email.";

        message.style.display =
            "block";


        /* ================================================= */
        /* MOVE TO OTP SCREEN */
        /* ================================================= */

        setTimeout(function() {

            showOTPStep();

        }, 1000);


    }


    catch (error) {

        message.className =
            "message error";

        message.innerText =
            error.message;

        message.style.display =
            "block";

    }


    finally {

        button.disabled = false;

        button.innerText =
            "Send OTP";

    }

}



/* ========================================================= */
/* STEP 2 - VERIFY OTP */
/* ========================================================= */

async function verifyOTP(event) {

    event.preventDefault();


    const otp =
        document
            .getElementById("otp")
            .value
            .trim();


    const email =
        sessionStorage.getItem(
            "resetEmail"
        );


    const message =
        document.getElementById("otpMessage");


    message.style.display =
        "none";


    if (!email) {

        message.className =
            "message error";

        message.innerText =
            "Session expired. Please enter your email again.";

        message.style.display =
            "block";

        showEmailStep();

        return;

    }


    if (!/^[0-9]{6}$/.test(otp)) {

        message.className =
            "message error";

        message.innerText =
            "Please enter a valid 6-digit OTP.";

        message.style.display =
            "block";

        return;

    }


    /* ================================================= */
    /* SAVE OTP */
    /* ================================================= */

    sessionStorage.setItem(
        "resetOTP",
        otp
    );


    message.className =
        "message success";

    message.innerText =
        "OTP verified. Create your new password.";

    message.style.display =
        "block";


    setTimeout(function() {

        showPasswordStep();

    }, 800);

}



/* ========================================================= */
/* STEP 3 - RESET PASSWORD */
/* ========================================================= */

async function resetPassword(event) {

    event.preventDefault();


    const email =
        sessionStorage.getItem(
            "resetEmail"
        );


    const otp =
        sessionStorage.getItem(
            "resetOTP"
        );

    const role =
        sessionStorage.getItem(
            "resetRole"
        ) || "student";


    const newPassword =
        document
            .getElementById("newPassword")
            .value;


    const confirmPassword =
        document
            .getElementById("confirmNewPassword")
            .value;


    const message =
        document.getElementById(
            "resetMessage"
        );


    message.style.display =
        "none";


    /* ================= VALIDATION ================= */

    if (!email || !otp) {

        message.className =
            "message error";

        message.innerText =
            "Reset session expired. Please start again.";

        message.style.display =
            "block";

        return;

    }


    if (newPassword.length < 6) {

        message.className =
            "message error";

        message.innerText =
            "Password must contain at least 6 characters.";

        message.style.display =
            "block";

        return;

    }


    if (newPassword !== confirmPassword) {

        message.className =
            "message error";

        message.innerText =
            "Passwords do not match.";

        message.style.display =
            "block";

        return;

    }


    try {


        const response =
            await fetch(
                API_URL + "/auth/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        otp: otp,

                        code: otp,

                        newPassword: newPassword,

                        password: newPassword,

                        role: role

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to reset password."
            );

        }


        message.className =
            "message success";

        message.innerText =
            data.message ||
            "Password updated successfully!";

        message.style.display =
            "block";


        /* ================================================= */
        /* CLEAR RESET INFORMATION */
        /* ================================================= */

        sessionStorage.removeItem(
            "resetEmail"
        );


        sessionStorage.removeItem(
            "resetOTP"
        );

        sessionStorage.removeItem(
            "resetRole"
        );


        /* ================================================= */
        /* RETURN TO LOGIN */
        /* ================================================= */

        setTimeout(function() {

            showLogin();


            document
                .getElementById("loginMessage")
                .className =
                "message success";


            document
                .getElementById("loginMessage")
                .innerText =
                "Password changed successfully. You can now login.";


            document
                .getElementById("loginMessage")
                .style.display =
                "block";


        }, 1500);


    }


    catch (error) {

        message.className =
            "message error";

        message.innerText =
            error.message;

        message.style.display =
            "block";

    }

}


</script>
