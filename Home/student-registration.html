<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | VIVEKANAND PLACEMENT CELL</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    rgba(7, 25, 48, 0.94),
                    rgba(13, 55, 95, 0.94)
                ),
                url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* ================= MAIN CARD ================= */

        .registration-card {

            width: 100%;
            max-width: 850px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }


        /* ================= HEADER ================= */

        .header {

            background: #0b1f3a;

            padding: 30px;

            text-align: center;

            color: white;
        }

        .header h1 {

            font-size: 28px;

            color: #ffb703;

            margin-bottom: 8px;

            letter-spacing: 1px;
        }

        .header p {

            color: #dbe5f2;

            font-size: 14px;
        }


        /* ================= FORM ================= */

        .form-container {

            padding: 40px;
        }


        .form-title {

            text-align: center;

            margin-bottom: 30px;
        }

        .form-title h2 {

            color: #0b1f3a;

            font-size: 26px;

            margin-bottom: 8px;
        }

        .form-title p {

            color: #777;

            font-size: 14px;
        }


        /* ================= FORM GRID ================= */

        .form-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 22px;
        }


        .form-group {

            display: flex;

            flex-direction: column;
        }


        .form-group.full {

            grid-column: 1 / -1;
        }


        label {

            font-size: 14px;

            font-weight: bold;

            color: #26374d;

            margin-bottom: 8px;
        }


        label span {

            color: red;
        }


        input,
        select {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5dce5;

            border-radius: 8px;

            background: #f9fafc;

            font-size: 14px;

            outline: none;

            transition: 0.3s;
        }


        input:focus,
        select:focus {

            border-color: #1455a0;

            background: white;

            box-shadow:
                0 0 0 3px rgba(20, 85, 160, 0.10);
        }


        /* ================= PASSWORD ================= */

        .password-box {

            position: relative;
        }


        .password-box input {

            padding-right: 70px;
        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #1455a0;

            font-weight: bold;

            cursor: pointer;
        }


        /* ================= BUTTON ================= */

        .submit-area {

            text-align: center;

            margin-top: 32px;
        }


        .submit-btn {

            width: 100%;

            max-width: 350px;

            padding: 14px 30px;

            border: none;

            border-radius: 30px;

            background: #ffb703;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .submit-btn:hover {

            background: #0b1f3a;

            color: white;

            transform: translateY(-2px);
        }


        /* ================= LOGIN ================= */

        .login-text {

            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 14px;
        }


        .login-text a {

            color: #1455a0;

            font-weight: bold;

            text-decoration: none;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        /* ================= MESSAGE ================= */

        .message {

            display: none;

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;
        }


        .error {

            background: #ffe8e8;

            color: #c62828;

            border: 1px solid #f5b5b5;
        }


        .success {

            background: #e8f7ed;

            color: #16723b;

            border: 1px solid #a9dfbc;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 650px) {

            body {

                padding: 15px;
            }


            .header h1 {

                font-size: 22px;
            }


            .form-container {

                padding: 25px 20px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .form-group.full {

                grid-column: auto;
            }


            .submit-btn {

                max-width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="registration-card">


        <!-- ================= HEADER ================= -->

        <div class="header">

            <h1>
                VIVEKANAND PLACEMENT CELL
            </h1>

            <p>
                Student Registration Portal
            </p>

        </div>


        <!-- ================= FORM CONTAINER ================= -->

        <div class="form-container">


            <div class="form-title">

                <h2>
                    Student Registration
                </h2>

                <p>
                    Create your student account to access placement opportunities.
                </p>

            </div>


            <!-- ================= ERROR MESSAGE ================= -->

            <div
                id="errorMessage"
                class="message error">
            </div>


            <!-- ================= SUCCESS MESSAGE ================= -->

            <div
                id="successMessage"
                class="message success">
            </div>


            <!-- ================= REGISTRATION FORM ================= -->

            <form
                id="studentRegistrationForm"
                onsubmit="registerStudent(event)">


                <div class="form-grid">


                    <!-- ================= FULL NAME ================= -->

                    <div class="form-group">

                        <label>
                            Full Name <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- ================= EMAIL ================= -->

                    <div class="form-group">

                        <label>
                            Email <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@gmail.com"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- ================= MOBILE ================= -->

                    <div class="form-group">

                        <label>
                            Mobile <span>*</span>
                        </label>

                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="10 digit mobile number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            inputmode="numeric"
                            autocomplete="tel"
                            required>

                    </div>


                    <!-- ================= DEPARTMENT ================= -->

                    <div class="form-group">

                        <label>
                            Department <span>*</span>
                        </label>

                        <select
                            id="department"
                            name="department"
                            required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="Computer Science & Engineering">
                                Computer Science & Engineering
                            </option>

                            <option value="Information Technology">
                                Information Technology
                            </option>

                            <option value="Mechanical Engineering">
                                Mechanical Engineering
                            </option>

                            <option value="Civil Engineering">
                                Civil Engineering
                            </option>

                            <option value="Electronics & Telecommunication">
                                Electronics & Telecommunication
                            </option>

                            <option value="Electrical Engineering">
                                Electrical Engineering
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- ================= COURSE ================= -->

                    <div class="form-group">

                        <label>
                            Course <span>*</span>
                        </label>

                        <select
                            id="course"
                            name="course"
                            required>

                            <option value="">
                                Select Course
                            </option>

                            <option value="B.Tech">
                                B.Tech
                            </option>

                            <option value="B.E.">
                                B.E.
                            </option>

                            <option value="B.Sc">
                                B.Sc
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="M.Tech">
                                M.Tech
                            </option>

                            <option value="MBA">
                                MBA
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- ================= USERNAME ================= -->

                    <div class="form-group">

                        <label>
                            Username <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Create username"
                            minlength="4"
                            autocomplete="username"
                            required>

                    </div>


                    <!-- ================= PASSWORD ================= -->

                    <div class="form-group">

                        <label>
                            Password <span>*</span>
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create password"
                                minlength="6"
                                autocomplete="new-password"
                                required>

                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword('password', this)">

                                Show

                            </button>

                        </div>

                    </div>


                    <!-- ================= CONFIRM PASSWORD ================= -->

                    <div class="form-group full">

                        <label>
                            Confirm Password <span>*</span>
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Re-enter your password"
                                minlength="6"
                                autocomplete="new-password"
                                required>

                            <button
                                type="button"
                                class="show-password"
                                onclick="togglePassword('confirmPassword', this)">

                                Show

                            </button>

                        </div>

                    </div>


                </div>


                <!-- ================= SUBMIT BUTTON ================= -->

                <div class="submit-area">

                    <button
                        type="submit"
                        class="submit-btn">

                        Create Student Account

                    </button>

                </div>


            </form>


            <!-- ================= LOGIN ================= -->

            <div class="login-text">

                Already have an account?

                <a href="login.html">
                    Login Here
                </a>

            </div>


        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ================= SHOW / HIDE PASSWORD ================= */

        function togglePassword(id, button) {

            const input = document.getElementById(id);

            if (input.type === "password") {

                input.type = "text";

                button.innerText = "Hide";

            } else {

                input.type = "password";

                button.innerText = "Show";

            }

        }


        /* ================= STUDENT REGISTRATION ================= */

        async function registerStudent(event) {

            event.preventDefault();

            const form =
                document.getElementById(
                    "studentRegistrationForm"
                );

            const fullName =
                document.getElementById(
                    "fullName"
                ).value.trim();

            const email =
                document.getElementById(
                    "email"
                ).value.trim();

            const mobile =
                document.getElementById(
                    "mobile"
                ).value.trim();

            const department =
                document.getElementById(
                    "department"
                ).value;

            const course =
                document.getElementById(
                    "course"
                ).value;

            const username =
                document.getElementById(
                    "username"
                ).value.trim();

            const password =
                document.getElementById(
                    "password"
                ).value;

            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;

            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );

            const successMessage =
                document.getElementById(
                    "successMessage"
                );


            /* Hide previous messages */

            errorMessage.style.display = "none";
            successMessage.style.display = "none";


            /* ================= PASSWORD VALIDATION ================= */

            if (password.length < 6) {

                errorMessage.innerText =
                    "Password must contain at least 6 characters.";

                errorMessage.style.display = "block";

                return;
            }


            if (password !== confirmPassword) {

                errorMessage.innerText =
                    "Password and Confirm Password do not match.";

                errorMessage.style.display = "block";

                return;
            }


            /* ================= MOBILE VALIDATION ================= */

            if (!/^[0-9]{10}$/.test(mobile)) {

                errorMessage.innerText =
                    "Please enter a valid 10-digit mobile number.";

                errorMessage.style.display = "block";

                return;
            }


            /* ================= USERNAME VALIDATION ================= */

            if (username.length < 4) {

                errorMessage.innerText =
                    "Username must contain at least 4 characters.";

                errorMessage.style.display = "block";

                return;
            }


            /* ================= REGISTRATION DATA ================= */

            const studentData = {

                fullName: fullName,

                email: email,

                mobile: mobile,

                department: department,

                course: course,

                username: username,

                password: password

            };


            console.log(
                "Student Registration Request:",
                {
                    fullName: fullName,
                    email: email,
                    mobile: mobile,
                    department: department,
                    course: course,
                    username: username
                }
            );


            /* ================= BACKEND API REQUEST ================= */

            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/student-register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(studentData)
                    }
                );


                /* ================= SERVER RESPONSE ================= */

                const data =
                    await response.json();


                /* ================= BACKEND ERROR ================= */

                if (!response.ok) {

                    errorMessage.innerText =
                        data.message ||
                        data.error ||
                        "Student registration failed.";

                    errorMessage.style.display =
                        "block";

                    return;
                }


                /* ================= SUCCESS ================= */

                successMessage.innerText =
                    data.message ||
                    "Student registration successful!";

                successMessage.style.display =
                    "block";


                /* ================= CLEAR FORM ================= */

                form.reset();


                /* ================= SUCCESS LOG ================= */

                console.log(
                    "Student registration successful.",
                    {
                        student: data.user || data.student || null
                    }
                );


            } catch (error) {

                console.error(
                    "Student registration API error:",
                    error
                );


                /* ================= CONNECTION ERROR ================= */

                errorMessage.innerText =
                    "Unable to connect to the backend server. Please make sure the backend is running on port 5000.";

                errorMessage.style.display =
                    "block";

            }

        }

    </script>

</body>

</html>
